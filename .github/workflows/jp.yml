name: JP

# Hourly: when Team-Haruki/haruki-sekai-master has moved past the commit the published library's
# lock pins, rip the episodes the lock does not list yet and publish them (SekaiStoryRipper
# ADR-0016). The published lock is the only state.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      selectors:
        description: "Episode selectors to rip again (space-separated); empty: all --missing"
        required: false
        default: ""
      force:
        description: "Run even when upstream has not changed"
        type: boolean
        default: false

# One run at a time; an hourly check queued behind a long rip then sees the lock that rip wrote.
concurrency:
  group: jp
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RIPPER_VERSION: v0.6.0
  UPSTREAM: Team-Haruki/haruki-sekai-master
  LIBRARY: s3://sekai-extra-assets/sekai-story/ripper/jp
  LOCK_URL: https://assets.pjsk.moe/sekai-extra-assets/sekai-story/ripper/jp/ripper.lock.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.check.outputs.upstream }}
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Compare upstream with the published lock
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
          SELECTORS: ${{ inputs.selectors || '' }}
        run: |
          upstream=$(git ls-remote "https://github.com/$UPSTREAM" HEAD | cut -f1)
          if [[ ! $upstream =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot read the HEAD of $UPSTREAM"
            exit 1
          fi
          lock=$(curl -fsS -H 'Cache-Control: no-cache' "$LOCK_URL?t=$(date +%s)")
          pinned=$(jq -r '.masterdata.url_template // ""' <<<"$lock" | grep -oE '[0-9a-f]{40}' || true)
          echo "upstream $upstream"
          echo "library  ${pinned:-<not pinned>} (ripper $(jq -r .toolVersion <<<"$lock"), assets $(jq -r .assetVersion <<<"$lock"), $(jq '.episodes | length' <<<"$lock") episodes)"
          run=false
          if [[ $upstream != "$pinned" || $FORCE == true || -n $SELECTORS ]]; then
            run=true
          fi
          echo "upstream=$upstream" >>"$GITHUB_OUTPUT"
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "run: $run"

  rip:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream }}
      CACHE: ${{ github.workspace }}/cache
    steps:
      - uses: actions/checkout@v4

      - name: Install ripper ${{ env.RIPPER_VERSION }}
        run: |
          name="ripper-$RIPPER_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/StarMoe-org/SekaiStoryRipper/releases/download/$RIPPER_VERSION/$name.tar.gz" | tar xz
          mv "$name/ripper" .
          ./ripper --version
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg >/dev/null; }

      - name: Configure
        run: |
          # The app version and hash the game currently accepts, from the same upstream commit.
          versions=$(curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/$UPSTREAM_SHA/versions/current_version.json")
          app_version=$(jq -er .appVersion <<<"$versions")
          app_hash=$(jq -er .appHash <<<"$versions")
          echo "masterdata $UPSTREAM@$UPSTREAM_SHA, app $app_version, data $(jq -r .dataVersion <<<"$versions"), assets $(jq -r .assetVersion <<<"$versions")"
          cat >ripper.toml <<EOF
          [cdn]
          region = "jp"
          app_version = "$app_version"

          [cdn.jp]
          app_hash = "$app_hash"

          [masterdata]
          url_template = "https://raw.githubusercontent.com/$UPSTREAM/$UPSTREAM_SHA/master/{name}.json"

          [paths]
          cache = "$CACHE"
          EOF

      - name: Guest account
        env:
          ACCOUNT: ${{ secrets.RIPPER_JP_ACCOUNT }}
        run: |
          # Without it ripper would register a new guest account on every run.
          if [[ -z $ACCOUNT ]]; then
            echo "::error::secret RIPPER_JP_ACCOUNT is not set"
            exit 1
          fi
          for field in installId userId credential; do
            value=$(jq -er ".$field | tostring" <<<"$ACCOUNT")
            echo "::add-mask::$value"
          done
          mkdir -p "$CACHE"
          (umask 077 && printf '%s' "$ACCOUNT" >"$CACHE/account.json")

      # The game's servers refuse addresses outside Japan. Set the variable VPNGATE to false to
      # connect directly.
      - name: Connect to a VPN Gate server in Japan
        id: vpn
        if: vars.VPNGATE != 'false'
        timeout-minutes: 10
        run: .github/scripts/vpngate.sh start

      - name: Rip and publish
        env:
          RIPPER_AB_KEY: ${{ secrets.RIPPER_AB_KEY }}
          RIPPER_AB_IV: ${{ secrets.RIPPER_AB_IV }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_ADDRESSING_STYLE: ${{ vars.S3_ADDRESSING_STYLE }}
          SELECTORS: ${{ inputs.selectors || '' }}
          PROXY: ${{ steps.vpn.outputs.proxy }}
        run: |
          if [[ -n $PROXY ]]; then
            # Only the game's servers go through Japan; S3, masterdata and the asset source stay direct.
            s3_host=${AWS_ENDPOINT_URL#*://}
            s3_host=${s3_host%%/*}
            s3_host=${s3_host%:*}
            export HTTPS_PROXY=$PROXY
            export NO_PROXY="localhost,127.0.0.1,githubusercontent.com,exmeaning.com${s3_host:+,$s3_host}"
          fi
          if [[ -n $SELECTORS ]]; then
            read -ra args <<<"$SELECTORS"
          else
            args=(all --missing)
          fi
          ./ripper --config ripper.toml manifest
          # Notes on CDN bundles whose CRC differs from the manifest are expected (ADR-0011).
          ./ripper --config ripper.toml --out "$LIBRARY" rip "${args[@]}" --report rip-report.json 2>&1 \
            | grep --line-buffered -v '^note: .* (served as the game gets it)$'

      - name: Disconnect from VPN Gate
        if: always() && steps.vpn.outcome == 'success'
        run: .github/scripts/vpngate.sh stop

      - name: Summary
        if: always() && hashFiles('rip-report.json') != ''
        run: |
          {
            echo "### JP @ \`${UPSTREAM_SHA:0:8}\`, assets $(jq -r .assetVersion rip-report.json)"
            echo
            echo "| Episode | Bundles | Warnings |"
            echo "|---|---|---|"
            jq -r '.episodes | to_entries[] | select(.value.index != null)
              | "| \(.key) | \(.value.bundles) | \(.value.warnings | length) |"' rip-report.json
            echo
            echo "Not exported:"
            echo
            jq -r '.episodes | to_entries[] | select(.value.index == null)
              | "- \(.key): \(.value.warnings[0].detail // "")"' rip-report.json
            echo
            echo "Warnings: \`$(jq -c .warningCounts rip-report.json)\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && hashFiles('rip-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rip-report
          path: rip-report.json
          retention-days: 30
