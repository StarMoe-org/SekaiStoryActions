name: CN

# Hourly: rip the CN episodes that Team-Haruki/haruki-sekai-sc-master adds (see rip.yml).

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      selectors:
        description: "Episode selectors to rip again (space-separated); empty: all --missing"
        required: false
        default: ""
      force:
        description: "Run even when upstream has not changed"
        type: boolean
        default: false

# One run at a time; an hourly check queued behind a long rip then sees the lock that rip wrote.
concurrency:
  group: cn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rip:
    uses: ./.github/workflows/rip.yml
    with:
      region: cn
      upstream: Team-Haruki/haruki-sekai-sc-master
      vpn: false
      selectors: ${{ inputs.selectors || '' }}
      force: ${{ inputs.force || false }}
    secrets:
      ab_key: ${{ secrets.RIPPER_CN_AB_KEY }}
      ab_iv: ${{ secrets.RIPPER_CN_AB_IV }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws_endpoint_url: ${{ secrets.AWS_ENDPOINT_URL }}
